; Runtime Health Check Probe configuration.
;
; The probe reads this file from the same directory as
; hsr_runtime_health_probe.dll (the build script copies it into build/).
;
; SAFETY: expected_table_rva is a COMPARISON-ONLY verification value. It is
; never used by the locator candidate search or scoring. Remove or set
; expect_rva_enabled=0 to disable the independent cross-check.

[health_check]
; Verification-only cross-check from data/raw/4.4.54/il2cpp/api_table_locator_4.4.54.json.
expected_table_rva=0x1A36480
expect_rva_enabled=1

; Repo-relative output directory for the JSON + human-readable log.
output_dir=data\raw\4.4.54\il2cpp

; How many assembly/class pointers to report in JSON (all pointers are still
; validated; reporting is capped, not validation).
max_assemblies_to_report=5
max_classes_to_read=10
max_class_count_reasonable=1000000
max_string_length=4096

; Wait after the probe thread starts, before module discovery.
wait_before_run_ms=1000
